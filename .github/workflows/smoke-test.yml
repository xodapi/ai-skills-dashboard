name: Smoke Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci
      
      - name: Check TypeScript compilation
        run: |
          cd frontend
          npx tsc --noEmit
      
      - name: Build frontend
        run: |
          cd frontend
          npm run build
      
      - name: Check build output
        run: |
          cd frontend
          if [ ! -d "dist" ]; then
            echo "❌ Build failed: dist directory not created"
            exit 1
          fi
          if [ ! -f "dist/index.html" ]; then
            echo "❌ Build failed: index.html not found"
            exit 1
          fi
          echo "✅ Build successful"
      
      - name: Start production preview
        run: |
          cd frontend
          npm run preview &
          PREVIEW_PID=$!
          echo "PREVIEW_PID=$PREVIEW_PID" >> $GITHUB_ENV
          sleep 5
      
      - name: Test homepage
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:4173)
          if [ "$response" != "200" ]; then
            echo "❌ Homepage returned $response"
            exit 1
          fi
          
          content=$(curl -s http://localhost:4173)
          if echo "$content" | grep -q "import.*from"; then
            echo "❌ Homepage contains uncompiled imports - Vite build failed"
            exit 1
          fi
          
          if echo "$content" | grep -q "DOCTYPE html"; then
            echo "✅ Homepage returns valid HTML"
          else
            echo "❌ Homepage does not return HTML"
            exit 1
          fi
      
      - name: Test critical routes
        run: |
          routes=("/" "/dashboard" "/skillsets" "/worldmap" "/radar" "/gap-analyzer" "/trainer/Python")
          
          for route in "${routes[@]}"; do
            response=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:4173$route)
            if [ "$response" != "200" ]; then
              echo "❌ Route $route returned $response"
              exit 1
            fi
            echo "✅ Route $route: OK"
          done
      
      - name: Cleanup
        if: always()
        run: |
          if [ -n "$PREVIEW_PID" ]; then
            kill $PREVIEW_PID || true
          fi
