name: Deploy to production

on:
  push:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: ai-skills-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Backend tests
        run: |
          cd backend
          python -m pytest tests/ -v || echo "⚠️  No tests found or tests failed"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install

      - name: TypeScript check
        run: |
          cd frontend
          npm run type-check

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Check for import errors in build
        run: |
          cd frontend/dist
          
          # Check for Vite import errors (skip binary files)
          if grep -rI "Failed to resolve import" . 2>/dev/null; then
            echo "❌ Vite import errors in build!"
            exit 1
          fi
          
          # Check for uncompiled .tsx imports
          # Save to file to avoid shell variable issues
          grep -ra 'import.*from.*\.tsx' . 2>/dev/null > /tmp/tsx_check.txt || true
          
          if [ -s /tmp/tsx_check.txt ]; then
            echo "❌ Uncompiled .tsx code in build!"
            echo "File size: $(wc -c < /tmp/tsx_check.txt) bytes, $(wc -l < /tmp/tsx_check.txt) lines"
            echo "Found .tsx imports in compiled output:"
            cat -A /tmp/tsx_check.txt | head -20
            echo ""
            echo "Files containing .tsx imports:"
            grep -ral 'import.*from.*\.tsx' . 2>/dev/null || true
            rm -f /tmp/tsx_check.txt
            exit 1
          fi
          
          rm -f /tmp/tsx_check.txt
          echo "✅ Build clean"

  deploy:
    runs-on: ubuntu-latest
    needs: verify
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy via git pull
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "EXPECTED_SHA='$EXPECTED_SHA' bash -s" << 'ENDSSH'
          set -Eeuo pipefail
          cd ${{ secrets.SERVER_DIR }}

          echo "📦 Fetching latest changes from GitHub..."
          git fetch origin master
          
          before=$(git rev-parse --short HEAD)
          echo "Current commit: $before"
          
          git checkout master
          git pull --ff-only origin master
          
          after=$(git rev-parse HEAD)
          after_short=$(git rev-parse --short HEAD)
          echo "Updated to commit: $after_short"
          
          # Verify we got the expected commit
          if [ "$after" != "$EXPECTED_SHA" ]; then
            echo "❌ Expected $EXPECTED_SHA but got $after"
            exit 1
          fi

          # Fix .env for production
          if [ -f backend/.env ]; then
            if ! grep -q "ENVIRONMENT=production" backend/.env; then
              sed -i 's/ENVIRONMENT=development/ENVIRONMENT=production/' backend/.env
              sed -i 's/DEBUG=True/DEBUG=False/' backend/.env
              sed -i 's|REDIS_URL=redis://localhost|REDIS_URL=redis://redis|' backend/.env
              sed -i 's|CELERY_BROKER_URL=redis://localhost|CELERY_BROKER_URL=redis://redis|' backend/.env
              sed -i 's|CELERY_RESULT_BACKEND=redis://localhost|CELERY_RESULT_BACKEND=redis://redis|' backend/.env
            fi
            sed -i 's|CORS_ORIGINS=.*|CORS_ORIGINS=https://ai-skills.syntog.ru,http://ai-skills.syntog.ru|' backend/.env
          fi

          echo "🐳 Restarting Docker containers..."
          docker compose up -d --build --remove-orphans

          echo "⏳ Waiting for services to start..."
          sleep 20

          # Run migrations if backend is up
          docker compose exec -T backend alembic upgrade head 2>/dev/null || echo "⚠️  Migration skipped"

          echo "✅ Docker status:"
          docker compose ps
          
          # Health check
          echo "🔍 Running backend health check..."
          backend_health=$(curl -f http://localhost:8000/api/v1/health 2>/dev/null || echo "failed")
          if [ "$backend_health" = "failed" ]; then
            echo "❌ Backend health check failed!"
            docker compose logs backend --tail=50
            exit 1
          fi
          echo "✅ Backend healthy: $backend_health"
          
          # Check training modules endpoint
          training_check=$(curl -f http://localhost:8000/api/v1/training/modules 2>/dev/null || echo "failed")
          if [ "$training_check" = "failed" ]; then
            echo "❌ Training modules endpoint failed!"
            exit 1
          fi
          echo "✅ Training modules working"
          
          echo ""
          echo "🎉 Deploy complete: $before → $after_short"
          ENDSSH

      - name: Health check
        run: |
          echo "🔍 Running health checks..."
          sleep 5
          
          response=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://ai-skills.syntog.ru)
          if [ "$response" != "200" ]; then
            echo "❌ Health check failed: homepage returned $response"
            exit 1
          fi
          
          content=$(curl -s --max-time 10 https://ai-skills.syntog.ru)
          if echo "$content" | grep -q "Failed to resolve import"; then
            echo "❌ Vite import errors detected - build failed!"
            exit 1
          fi
          
          if echo "$content" | grep -q "import.*from.*\\.tsx"; then
            echo "❌ Uncompiled .tsx code detected - white screen!"
            exit 1
          fi
          
          echo "✅ Health check passed!"
